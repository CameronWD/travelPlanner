<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font:var(--type-body);padding:20px;box-sizing:border-box} *{box-sizing:border-box}</style><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="../../assets/dev-loader.js" data-root="../../"></script></head><body>
<div id="root"></div>
<script type="text/babel">
TeepeeDS.ready.then(() => { const { Logo, Icon, Button, IconButton, Chip, Badge, Card, ProgressBar, StatCard, Avatar, AvatarStack, Input, Select, Stepper, Toggle, Checkbox, Segmented, TabBar, Dock, TopBar, ListRow, Sheet, Toast, Tooltip, EmptyState } = TeepeeDS;
function Demo(){ const [open,setOpen]=React.useState(false);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
    <div style={{display:'flex',flexDirection:'column',gap:12,alignItems:'flex-start'}}><Toast action="Undo">Hakone added · 1 night</Toast><Toast tone="coral">Heads up — Oct 18 has 6 things</Toast><Toast tone="ink">Saved to Slow Kyoto</Toast><div style={{display:'flex',gap:10,marginTop:8}}><Tooltip label="Compare forks"><IconButton label="Compare">⇄</IconButton></Tooltip><Button variant="secondary" onClick={()=>setOpen(true)}>Open a sheet</Button></div></div>
    <div style={{position:'relative',height:300,border:'var(--border)',borderRadius:'var(--radius-xl)',overflow:'hidden',background:'var(--surface-page)',padding:14}}>
      <EmptyState glyph="Zz" tone="lilac" title="No beds yet" body="Every stop needs somewhere to sleep." action="+ Add a stay" />
      <Sheet open={open} title="Add a place" onClose={()=>setOpen(false)} footer={<Button block onClick={()=>setOpen(false)}>Add Hakone</Button>}><Input placeholder="Where?" /><Stepper value={1} unit="n" /></Sheet>
    </div></div>; }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script>
</body></html>
