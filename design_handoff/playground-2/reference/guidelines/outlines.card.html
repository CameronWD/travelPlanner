<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Always 2px ink. Dashed = empty slot. Press pushes the block into its shadow" name="Outlines & press" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font:var(--type-body);padding:20px;box-sizing:border-box} *{box-sizing:border-box}</style></head><body>
<div style="display:flex;gap:18px;align-items:center">
  <div style="width:130px;height:64px;border:var(--border);border-radius:var(--radius-l);background:var(--accent-route);display:grid;place-items:center;font:var(--type-label)">solid 2px</div>
  <div style="width:130px;height:64px;border:var(--border-dashed);border-color:var(--outline-soft);border-radius:var(--radius-l);display:grid;place-items:center;font:var(--type-label);color:var(--text-muted)">+ dashed slot</div>
  <div style="width:130px;height:64px;border:var(--border);border-radius:var(--radius-l);background:var(--surface-card);box-shadow:var(--shadow-2);display:grid;place-items:center;font:var(--type-label)">rest</div>
  <div style="width:130px;height:64px;border:var(--border);border-radius:var(--radius-l);background:var(--surface-card);box-shadow:var(--shadow-pressed);transform:var(--press-offset);display:grid;place-items:center;font:var(--type-label)">pressed</div>
  </div>
</body></html>
