<!-- @dsCard group="Brand" viewport="760x300" subtitle="Locked: tent-pin. Export set in assets/logo/export" name="Logo — locked" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font:var(--type-body);padding:20px;box-sizing:border-box} *{box-sizing:border-box}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
<div style="padding:16px;border:2px solid #1D1D1B;border-radius:var(--radius-l);background:#FFFBF3;text-align:center"><img src="../assets/logo/export/mark/tent-pin.svg" width="56" alt=""><div style="font:var(--type-h5);margin-top:8px;color:#1D1D1B">Primary</div><div style="font:var(--type-caption);color:#6B6660">light surfaces</div></div>
<div style="padding:16px;border:2px solid #5A554C;border-radius:var(--radius-l);background:#211F1B;text-align:center"><img src="../assets/logo/export/mark/tent-pin-on-dark.svg" width="56" alt=""><div style="font:var(--type-h5);margin-top:8px;color:#EDE6D8">On dark</div><div style="font:var(--type-caption);color:#A59D8F">sticker edge · headers, lockup</div></div>
<div style="padding:16px;border:var(--border);border-radius:var(--radius-l);background:var(--surface-card);text-align:center;color:var(--text-primary)"><img src="../assets/logo/export/mark/tent-pin-mono-black.svg" width="56" alt=""><div style="font:var(--type-h5);margin-top:8px">Mono</div><div style="font:var(--type-caption);color:var(--text-muted)">currentColor in UI</div></div>
<div style="padding:16px;border:var(--border);border-radius:var(--radius-l);background:var(--surface-card);text-align:center;display:flex;flex-direction:column;align-items:center"><div style="display:flex;gap:10px;align-items:flex-end;height:56px"><img src="../assets/logo/export/favicon/favicon-16.png" width="16" alt=""><img src="../assets/logo/export/favicon/favicon-32.png" width="32" alt=""><img src="../assets/logo/export/favicon/favicon.svg" width="48" alt=""></div><div style="font:var(--type-h5);margin-top:8px">Favicon</div><div style="font:var(--type-caption);color:var(--text-muted)">no poles, heavier line</div></div>
</div>
<div style="display:flex;gap:18px;align-items:center;margin-top:18px">
<img src="../assets/logo/export/app-icon/icon-512.png" width="72" alt="">
<img src="../assets/logo/export/app-icon/icon-maskable-512.png" width="72" style="border-radius:50%" alt="">
<img src="../assets/logo/export/app-icon/app-icon-dark.svg" width="72" alt="">
<div style="font:var(--type-caption);color:var(--text-muted);line-height:1.5;max-width:300px">App icon · maskable (Android safe zone) · sun tile for dark surfaces, avatars, small sizes. PNGs at 16/32/48/180/192/512. Setup notes in <b style="color:var(--text-primary)">export/manifest-snippet.md</b>.</div>
</div>
</body></html>
