<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font:var(--type-body);padding:20px;box-sizing:border-box} *{box-sizing:border-box}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
  <div style="padding:12px;border:var(--border);border-radius:var(--radius-l);background:#FF6B4A;box-shadow:var(--shadow-1)"><div style="font:var(--type-h4);letter-spacing:var(--tracking-display)">coral</div><div style="font:var(--type-caption);margin-top:6px;line-height:1.4">the trip · CTAs · something missing</div></div><div style="padding:12px;border:var(--border);border-radius:var(--radius-l);background:#FFD166;box-shadow:var(--shadow-1)"><div style="font:var(--type-h4);letter-spacing:var(--tracking-display)">sun</div><div style="font:var(--type-caption);margin-top:6px;line-height:1.4">money · transport · to-dos</div></div><div style="padding:12px;border:var(--border);border-radius:var(--radius-l);background:#5BC0BE;box-shadow:var(--shadow-1)"><div style="font:var(--type-h4);letter-spacing:var(--tracking-display)">teal</div><div style="font:var(--type-caption);margin-top:6px;line-height:1.4">chapters · places · done</div></div><div style="padding:12px;border:var(--border);border-radius:var(--radius-l);background:#C7A2FF;box-shadow:var(--shadow-1)"><div style="font:var(--type-h4);letter-spacing:var(--tracking-display)">lilac</div><div style="font:var(--type-caption);margin-top:6px;line-height:1.4">beds · sleeps · people</div></div></div>
</body></html>
