name: Reminders cron

# Trigger the push-reminder dispatcher on a schedule. Vercel Hobby cron only
# runs once per day, so we drive the every-5-minutes cadence from here instead.
# The endpoint is auth'd by CRON_SECRET (fail-closed if unset). GitHub may delay
# scheduled runs under load, and disables schedules after 60 days of repo
# inactivity — fine for a low-stakes reminder ping.
#
# The job skips cleanly when APP_URL or CRON_SECRET are missing rather than
# failing: an unconfigured repo should stay quiet, not email a failure every
# five minutes. See docs/DEPLOY.md §5 for the repo Secret + Variable to set.
#
# A non-2xx response from a *configured* endpoint (e.g. the app itself is
# down) is logged clearly but does NOT fail the job either: on the */5
# schedule, failing here would mean ~288 failure emails/day for one outage.
# curl runs without --fail so an HTTP error status isn't treated as a curl
# failure. A genuine transport-level problem (DNS, TLS, connection refused —
# i.e. APP_URL itself is misconfigured) still makes curl exit non-zero and
# still fails the job — that case is worth surfacing loudly.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check cron config is present
        id: config
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "APP_URL and/or CRON_SECRET are not configured — skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}

      - name: Hit the reminders endpoint
        if: steps.config.outputs.configured == 'true'
        run: |
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/reminders")
          echo "Reminders endpoint responded with HTTP ${status}"
          cat response.txt
          echo
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::warning title=Reminders cron non-2xx::Reminders endpoint returned HTTP ${status} — not failing the job, see response body above."
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
