name: Reminders cron

# Trigger the push-reminder dispatcher on a schedule. The endpoint is auth'd
# by CRON_SECRET (fail-closed if unset). GitHub may delay scheduled runs under
# load, and disables schedules after 60 days of repo inactivity — fine for a
# low-stakes reminder ping.
#
# CADENCE: daily, off-peak minute. Every authorized hit wakes Neon (~5 min of
# compute), so cadence is the CU-hour lever: daily ≈ 3 CU-h/month vs ~60 for
# hourly on the 100 CU-h free tier. Daily is enough while the reminders
# feature has no production users (zero Reminder rows / push subscriptions as
# of 2026-09-16), and the payment-alert pass is UTC-day granular by design.
#
# ⚠️ BUMP TO HOURLY ("23 * * * *") BEFORE LATE NOVEMBER 2026: the first real
# payment alert lands Nov 28 (cost due 2026-12-01) and travel starts early
# December — from then, user-set reminders being up to a day late stops being
# acceptable.
#
# The job skips cleanly when APP_URL or CRON_SECRET are missing rather than
# failing: an unconfigured repo should stay quiet, not email a failure every
# five minutes. See docs/DEPLOY.md §5 for the repo Secret + Variable to set.
#
# A non-2xx response from a *configured* endpoint (e.g. the app itself is
# down) is logged clearly but does NOT fail the job: transient outages are
# not worth a failure email per scheduled run.
# curl runs without --fail so an HTTP error status isn't treated as a curl
# failure. A genuine transport-level problem (DNS, TLS, connection refused —
# i.e. APP_URL itself is misconfigured) still makes curl exit non-zero and
# still fails the job — that case is worth surfacing loudly.
on:
  schedule:
    - cron: "23 23 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check cron config is present
        id: config
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "APP_URL and/or CRON_SECRET are not configured — skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}

      - name: Hit the reminders endpoint
        if: steps.config.outputs.configured == 'true'
        run: |
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/reminders")
          echo "Reminders endpoint responded with HTTP ${status}"
          cat response.txt
          echo
          if [ "${status}" -eq 503 ]; then
            # 503 is the route's dedicated "push is not configured" signal
            # (VAPID env vars missing on the deployment). Unlike a transient
            # outage this is a persistent misconfiguration, so fail the job —
            # on the daily schedule that is one loud email per day, not spam.
            echo "::error title=Reminders cron misconfigured::HTTP 503 — the app reports push is not configured (VAPID env vars missing on the deployment). Failing the job so this is not silent."
            exit 1
          fi
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::warning title=Reminders cron non-2xx::Reminders endpoint returned HTTP ${status} — not failing the job, see response body above."
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
