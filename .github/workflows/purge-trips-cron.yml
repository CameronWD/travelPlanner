name: Purge trips cron

# Hard-deletes Trips that have sat in Recently deleted past their 30-day
# Restore window (ADR 0067), scheduling their cover and Attachment blobs for
# the retention sweep first (lib/trip-purge.ts). The same run deletes Usage
# records older than 180 days (lib/usage/purge.ts). Auth, skip-when-unconfigured
# and failing loudly on any non-2xx all mirror digest-cron.yml — see docs/DEPLOY.md §5.
# A cold start is retried twice (curl --retry 2, 20 s apart) before the job fails.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check cron config is present
        id: config
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "APP_URL and/or CRON_SECRET are not configured — skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}

      - name: Hit the purge-trips endpoint
        if: steps.config.outputs.configured == 'true'
        run: |
          status=$(curl --silent --show-error --retry 2 --retry-delay 20 --output response.txt --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/purge-trips")
          echo "Purge-trips endpoint responded with HTTP ${status}"
          head -c 500 response.txt
          echo
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error title=Purge-trips cron failed::Purge-trips endpoint returned HTTP ${status}. Response body is in the log above."
            exit 1
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
