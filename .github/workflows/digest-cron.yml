name: Digest cron

# Trigger the Digest dispatcher on a schedule. The endpoint is auth'd by
# CRON_SECRET (fail-closed if unset). GitHub may delay scheduled runs under
# load, and disables schedules after 60 days of repo inactivity — tolerable
# here because the route matches a three-hour local window, not an exact hour.
#
# CADENCE: five fixed UTC hours. The route dispatches only to subscribers whose
# LOCAL hour falls in a morning (06–08) or evening (20–22) window, so the
# schedule's job is simply to have a run land inside each window for each zone
# we serve — the filtering is the route's, not the cron's. Every authorized hit
# wakes Neon (~5 min of compute), which is the CU-hour lever: five runs a day
# ≈ 15 CU-h/month against the 100 CU-h free tier, and each extra zone is one
# more hour at roughly 3 CU-h/month (ADR 0047).
#
# The two halves of this — these UTC hours and the route's local windows — are
# one contract, and lib/digest-schedule.test.ts fails if you edit either side
# alone. Do not "tidy" an hour out of the list without running it.
#
# The job skips cleanly when APP_URL or CRON_SECRET are missing rather than
# failing: an unconfigured repo should stay quiet, not email a failure on every
# run. See docs/DEPLOY.md §5 for the repo Secret + Variable to set.
#
# A non-2xx response from a *configured* endpoint (e.g. the app itself is
# down) is logged clearly but does NOT fail the job: transient outages are
# not worth a failure email per scheduled run.
# curl runs without --fail so an HTTP error status isn't treated as a curl
# failure. A genuine transport-level problem (DNS, TLS, connection refused —
# i.e. APP_URL itself is misconfigured) still makes curl exit non-zero and
# still fails the job — that case is worth surfacing loudly.
on:
  schedule:
    # Each run dispatches only to subscribers whose LOCAL hour falls in the
    # morning (06–08) or evening (20–22) window (app/api/cron/digest/route.ts).
    # These five UTC hours cover Central Europe (UTC+1/+2) and eastern
    # Australia in BOTH of its offsets — AEDT (UTC+11, December) and AEST
    # (UTC+10, the other seven months, and Brisbane all year round). Where each
    # run lands, ✔ marking the one that actually delivers:
    #
    #   UTC    Vienna CET       Brisbane AEST         Sydney AEDT
    #   06:00  07:00 MORNING ✔  16:00 —               17:00 —
    #   09:00  10:00 —          19:00 —               20:00 EVENING ✔
    #   10:00  11:00 —          20:00 EVENING ✔       21:00 EVENING (absorbed)
    #   19:00  20:00 EVENING ✔  05:00 —               06:00 MORNING ✔ (next day)
    #   20:00  21:00 (absorbed) 06:00 MORNING ✔ (+1d) 07:00 MORNING (absorbed)
    #
    # An "absorbed" run sends nothing: the dispatch ledger is keyed
    # (user, trip, local date, slot), so the second run in a window is a no-op.
    # Adding a zone is one more hour here, at roughly 3 CU-h/month each
    # (ADR 0047) — a half-hour zone included, and with no code change: the
    # route filters on the subscriber's local HOUR, so a 15:00Z run is 20:30
    # in Asia/Kolkata and 20:45 in Asia/Kathmandu, hour 20 either way, which
    # already matches EVENING. See docs/DEPLOY.md §5.
    - cron: "0 6,9,10,19,20 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check cron config is present
        id: config
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "APP_URL and/or CRON_SECRET are not configured — skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}

      - name: Hit the digest endpoint
        if: steps.config.outputs.configured == 'true'
        run: |
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/digest")
          echo "Digest endpoint responded with HTTP ${status}"
          cat response.txt
          echo
          if [ "${status}" -eq 503 ]; then
            # 503 is the route's dedicated "push is not configured" signal
            # (VAPID env vars missing on the deployment). Unlike a transient
            # outage this is a persistent misconfiguration, so fail the job —
            # on this schedule that is at most five loud emails a day, not spam.
            echo "::error title=Digest cron misconfigured::HTTP 503 — the app reports push is not configured (VAPID env vars missing on the deployment). Failing the job so this is not silent."
            exit 1
          fi
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::warning title=Digest cron non-2xx::Digest endpoint returned HTTP ${status} — not failing the job, see response body above."
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
