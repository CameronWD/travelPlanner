<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F2674A" />
  <title>You're offline · Teepee</title>
  <style>
    :root {
      --primary: #F2674A;
      --bg: #FBF6EF;
      --text: #1a1a1a;
      --muted: #6b6b6b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
      text-align: center;
    }

    .icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2.25rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text);
    }

    p {
      font-size: 1rem;
      color: var(--muted);
      max-width: 340px;
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }

    .retry-btn {
      margin-top: 1.5rem;
      padding: 0.625rem 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 9999px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
    }

    .retry-btn:hover {
      opacity: 0.9;
    }

    .saved-trips {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    .saved-trips[hidden] {
      display: none;
    }

    .saved-trips a {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      background: white;
      color: var(--text);
      border-radius: 9999px;
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="icon">✈️</div>
  <h1>You're offline</h1>
  <p>Saved pages can still be read. Changes need a connection.</p>
  <nav id="saved-trips" class="saved-trips" hidden></nav>
  <button class="retry-btn" onclick="window.location.reload()">Try again</button>
  <script>
    (function () {
      if (!('caches' in window)) return;
      var list = document.getElementById('saved-trips');
      caches
        .open('teepee-pages-v1')
        .then(function (cache) { return cache.keys(); })
        .then(function (keys) {
          var homes = [];
          var hasTrips = false;
          keys.forEach(function (key) {
            var url = new URL(key.url);
            var path = url.pathname;
            if (url.origin !== location.origin || url.search || !/^\/trips(\/[^/]+)?$/.test(path) || path === '/trips/new') return;
            if (path === '/trips') hasTrips = true;
            else if (homes.indexOf(path) === -1) homes.unshift(path);
          });
          var paths = hasTrips ? homes.concat('/trips') : homes;
          paths.forEach(function (path) {
            var link = document.createElement('a');
            link.href = path;
            link.textContent = path === '/trips' ? 'Your trips' : titleCase(path.slice(path.lastIndexOf('/') + 1));
            list.appendChild(link);
          });
          if (paths.length) list.hidden = false;
        })
        .catch(function () {});

      function titleCase(slug) {
        return slug.split('-').map(function (word) { return word.charAt(0).toUpperCase() + word.slice(1); }).join(' ');
      }
    })();
  </script>
</body>
</html>
